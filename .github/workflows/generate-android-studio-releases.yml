name: Generate Android Studio releases

on:
  schedule:
    - cron: "1 1 * * *"
  workflow_dispatch:

jobs:
  generate:
    if: github.ref == 'refs/heads/main' && github.repository == 'JetBrains/intellij-sdk-docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate
        run: "${GITHUB_WORKSPACE}/.github/scripts/android_studio_releases.main.kts"
      - name: Commit changes
        uses: Endbug/add-and-commit@v11
        with:
          message: 'Generate Android Studio releases'
          add: 'topics/_generated/*'
